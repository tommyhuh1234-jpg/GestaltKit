name: GestaltKit
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
targets:
  GestaltKit:
    type: application
    platform: iOS
    sources:
      - GestaltKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.GestaltKit
        PRODUCT_NAME: GestaltKit
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: GestaltKit
