
name: Build GestaltKit IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build GestaltKit
        run: |
          xcodebuild \
            -project GestaltKit.xcodeproj \
            -scheme GestaltKit \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Debug-iphoneos/GestaltKit.app Payload/
          zip -r GestaltKit.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GestaltKit-IPA
          path: GestaltKit.ipa
